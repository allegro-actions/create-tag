name: "create-tag"
description: "Creates Git tag"

inputs:
  tag:
    description: 'tag to create'
    required: true
  current-tag:
    description: 'current release tag'
    required: false
    default: ''
    deprecationMessage: current-tag is no longer used
  user-name:
    description: 'the username that is associated with Git commits/tags'
    required: false
    default: ''
  user-email:
    description: 'the user email that is associated with Git commits/tags'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Print tags
      shell: bash
      run: |
        echo "Going to create tag: $TAG"
        echo "Current tags:"
        git tag --points-at HEAD
      env:
        TAG: ${{ inputs.tag }}
        CURRENT_TAG: ${{ inputs.current-tag }}
    - name: Configure Git username
      if: "${{ inputs.user-name != '' }}"
      shell: bash
      run: git config user.name ${{ inputs.user-name }}
    - name: Configure Git user email
      if: "${{ inputs.user-email != '' }}"
      shell: bash
      run: git config user.email ${{ inputs.user-email }}
    - name: tag
      shell: bash
      run: git tag -am "$TAG" "$TAG" && git push origin "$TAG"
      env:
        TAG: ${{ inputs.tag }}
